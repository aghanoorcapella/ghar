<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ghar: The Family Sim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: a "truck-art" framed scene up top, character console below; one deliberate dark night-bazaar look */
:root{
  --ink:#140f24; --panel:#1f1836; --panel2:#2a2148; --line:#3d3166;
  --fg:#f6efe1; --dim:#b9add6;
  --saffron:#ffb627; --rose:#ff4f7b; --teal:#19c3b0; --leaf:#7bd34a; --sky:#5aa9ff;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
.logo{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--saffron),var(--rose) 50%,var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo small{display:block;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);-webkit-text-fill-color:var(--dim);font-family:var(--body);font-weight:800;margin-top:4px}
.clocks{display:flex;gap:8px;flex-wrap:wrap}
.clock{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:118px}
.clock b{display:block;font-family:var(--display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:800}
.stage{position:relative;border-radius:14px;padding:6px;
  background:repeating-linear-gradient(45deg,var(--saffron) 0 10px,var(--rose) 10px 20px,var(--teal) 20px 30px,var(--leaf) 30px 40px)}
.stage canvas{display:block;width:100%;aspect-ratio:16/8;max-width:100%;border-radius:9px;background:#000}
.loc-tag{position:absolute;left:18px;top:16px;background:rgba(20,15,36,.82);border-radius:8px;padding:4px 10px;font-weight:800;font-size:13px}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,15,36,.9);border:1px solid var(--saffron);
  border-radius:10px;padding:8px 14px;font-weight:700;max-width:90%;text-align:center;transition:opacity .4s}
.grid{display:grid;grid-template-columns:260px 1fr 260px;gap:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
h2{font-family:var(--display);font-size:18px;margin:0 0 8px;font-weight:700;text-wrap:balance}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--dim);font-weight:800}
.fam{display:flex;flex-direction:column;gap:6px}
.mem{display:flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid transparent;border-radius:10px;padding:7px 9px;text-align:left;width:100%}
.mem.on{border-color:var(--saffron)}
.mem .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#140f24;font-size:17px}
.mem .nm{font-weight:800;line-height:1.1}
.mem .sub{font-size:11px;color:var(--dim)}
.mem .where{margin-left:auto;font-size:11px;color:var(--dim);text-align:right}
.bar{height:8px;background:#120d22;border-radius:5px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.needs{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:8px 0 12px}
.needs div{font-size:12px;font-weight:700}
.who{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.who .av{width:52px;height:52px;font-size:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#140f24;flex:none}
.who p{margin:2px 0 0;color:var(--dim);font-size:13px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .1s,border-color .1s}
.act:hover:not(:disabled){border-color:var(--saffron);transform:translateY(-1px)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act b{font-size:14px}
.act small{font-size:11px;color:var(--dim)}
.act.game{border-color:var(--teal)}
.act.game b::after{content:" ★ game";font-size:10px;color:var(--teal);letter-spacing:.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--panel2);border-radius:9px;padding:6px 8px}
.stat b{font-family:var(--display);font-size:19px;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--dim)}
.log{display:flex;flex-direction:column;gap:5px;max-height:230px;overflow:auto;font-size:13px}
.log p{margin:0;padding:5px 8px;background:var(--panel2);border-radius:7px;line-height:1.35}
.log p em{color:var(--saffron);font-style:normal;font-weight:800}
.bondwrap{margin-bottom:10px}
.bondwrap .bar{height:12px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,7,20,.82);display:grid;place-items:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.box{background:var(--panel);border:3px solid var(--saffron);border-radius:16px;padding:18px;width:min(640px,100%);max-height:100%;overflow:auto}
.box h1{font-family:var(--display);font-size:30px;margin:0 0 6px;line-height:1.1;text-wrap:balance}
.box p{line-height:1.5;margin:6px 0}
.box .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--saffron);color:#140f24;border:0;border-radius:10px;padding:10px 16px;font-weight:800;font-size:15px}
.btn.alt{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.mg canvas{width:100%;max-width:100%;aspect-ratio:4/3;display:block;border-radius:10px;background:#000;touch-action:none}
.mghud{display:flex;justify-content:space-between;font-weight:800;margin:6px 0;font-variant-numeric:tabular-nums}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.pick button{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left}
.pick button:hover{border-color:var(--saffron)}
.ach{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ach div{background:var(--panel2);border-radius:8px;padding:6px 10px;font-size:13px}
.ach div.lock{opacity:.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<div class="wrap">
  <header>
    <div class="logo">Ghar<small>Karachi · Shikarpur · Des Moines</small></div>
    <div class="clocks">
      <div class="clock"><span>Day</span><b id="cDay">1</b></div>
      <div class="clock"><span>Pakistan (PKT)</span><b id="cPk">7:00 AM</b></div>
      <div class="clock"><span>Noor · Des Moines</span><b id="cUs">8:00 PM</b></div>
      <button class="iconbtn" id="btnMenu">Menu</button>
    </div>
  </header>

  <div class="stage">
    <canvas id="scene" width="1280" height="640"></canvas>
    <div class="loc-tag" id="locTag">Home</div>
    <div class="toast" id="toast" style="opacity:0"></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>The family</h2>
      <div class="fam" id="fam"></div>
    </div>
    <div class="card">
      <div class="who" id="who"></div>
      <div class="needs" id="needs"></div>
      <div class="lbl" style="margin-bottom:6px">What should they do?</div>
      <div class="acts" id="acts"></div>
    </div>
    <div class="card">
      <div class="bondwrap">
        <div class="lbl">Family bond · reunion at 100</div>
        <div class="bar"><i id="bondBar" style="width:20%;background:linear-gradient(90deg,var(--rose),var(--saffron))"></i></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="lbl" style="margin-bottom:6px">Family diary</div>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>
<div class="modal" id="modal" hidden><div class="box" id="box"></div></div>
<script>
// ===== DATA =====
const PEOPLE = {
  noor:  {name:"Noor",  role:"YouTuber · double graduate", age:22, color:"#ffb627", init:"N", home:"desmoines",
          bio:"Came to the USA in Aug 2023. BS Computer Science (WGU) and MBA in Project Management (Capella), both done back to back. Vlogs from Des Moines, watches UFC with the family over video call."},
  tozia: {name:"Tozia", role:"Mom · heart of the house", age:41, color:"#ff4f7b", init:"T", home:"karachi",
          bio:"Runs the whole house. Talks to her 5 sisters every single day. Nothing happens in this family that she doesn't hear about first."},
  mir:   {name:"Mir",   role:"Dad · ex-5 Horse, landlord", age:51, color:"#19c3b0", init:"M", home:"karachi",
          bio:"Served in the Armored Corps, 5 Horse. Now an agricultural landlord with lands around Sultan Kot. Loves a good movie on Apple TV."},
  umair: {name:"Umair", role:"Brother · future dentist", age:19, color:"#5aa9ff", init:"U", home:"karachi",
          bio:"MDCAT top 100 in Shikarpur, 90%+ in matric and FSc. Studying dentistry, runs a YouTube channel, Messi fan for life, UFC fanatic."},
  ariha: {name:"Ariha", role:"Sister · chicken queen", age:10, color:"#7bd34a", init:"A", home:"karachi",
          bio:"Loves her pet chickens more than anything. Swimming classes, school, and racing her bicycle."}
};
const ORDER = ["noor","tozia","mir","umair","ariha"];
const LOCS = {
  karachi:   {name:"Clifton Block 2 flat · Karachi", short:"Karachi", tz:"pk"},
  shikarpur: {name:"The haveli · Sultan Kot, Shikarpur", short:"Sultan Kot", tz:"pk"},
  desmoines: {name:"Noor's apartment · Des Moines, Iowa", short:"Des Moines", tz:"us"}
};
const US_OFFSET = -11; // PKT (UTC+5) to Central Standard Time (UTC-6)

const ACH = [
  {id:"grad",   t:"Double Graduate", d:"Noor's BS and MBA. Unlocked from day one."},
  {id:"hen10",  t:"Chicken Empire", d:"Ariha has 10 chickens."},
  {id:"subs10k",t:"Silver Play Button soon", d:"Noor reaches 10,000 subscribers."},
  {id:"dentist",t:"Dr. Umair", d:"Umair's dental studies reach 100%."},
  {id:"dodson", t:"The Magician", d:"Survive 20 punches in Dodson Dodge."},
  {id:"goat",   t:"GOAT Debate Settled", d:"Score 5/5 free kicks as Messi would."},
  {id:"sisters",t:"All Five on the Line", d:"Answer 15 calls in Sisters Hotline."},
  {id:"horse",  t:"5 Horse Salute", d:"Reach drill level 7 in Parade Ground."},
  {id:"harvest",t:"Bumper Crop", d:"Earn PKR 500,000 from the lands."},
  {id:"swim",   t:"Gold in the Pool", d:"Win a swimming race."},
  {id:"movie",  t:"Family Movie Night", d:"Everyone in Pakistan watches a movie together."},
  {id:"ufc",    t:"Fight Night Across Oceans", d:"Noor and Umair watch UFC together."},
  {id:"reunion",t:"Ghar Wapsi", d:"Family bond hits 100. Noor comes home."}
];

// ===== STATE =====
function freshState(){
  const s = {
    day:1, min:7*60, // minutes since midnight PKT
    bond:25, pkr:150000, usd:400, subs:2400, ytU:900, study:35, swim:20, eggs:0,
    chickens:["Kukdi","Sultana","Toofan"], crop:30, totalHarvest:0,
    sel:"ariha", loc:{noor:"desmoines",tozia:"karachi",mir:"karachi",umair:"karachi",ariha:"karachi"},
    needs:{}, log:[], ach:{grad:true}, flags:{}, seen:false, ended:false, today:{}
  };
  ORDER.forEach(k=>s.needs[k]={energy:80,hunger:70,fun:60,social:55});
  return s;
}
let S = freshState();
const SAVE_KEY="ghar-family-sim-v1";
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r=localStorage.getItem(SAVE_KEY); if(r){ const o=JSON.parse(r); if(o&&o.needs&&o.needs.noor){ S=Object.assign(freshState(),o); S.today=S.today||{}; S.flags=S.flags||{}; return true; } } }catch(e){} return false; }

// ===== HELPERS =====
const $ = id=>document.getElementById(id);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pickOne=a=>a[Math.floor(Math.random()*a.length)];
const pkHour=()=>Math.floor(S.min/60)%24;
const usMin=()=>((S.min+US_OFFSET*60)%1440+1440)%1440;
function fmt(m){ m=((m%1440)+1440)%1440; let h=Math.floor(m/60), mm=m%60, ap=h>=12?"PM":"AM"; h=h%12||12; return h+":"+String(mm).padStart(2,"0")+" "+ap; }
function localMin(who){ return LOCS[S.loc[who]].tz==="us"? usMin() : S.min; }
function isAwake(who){
  if(who==="noor"){ const h=Math.floor(usMin()/60); return (h>=7 && h<24) || S.flags.noorUp; }
  return true; // the Pakistan day runs 7 AM to 11 PM
}
function together(a,b){ return S.loc[a]===S.loc[b]; }
function pkFamilyTogether(){ return ["tozia","mir","umair","ariha"].every(k=>S.loc[k]===S.loc.mir); }
function fmtPkr(n){ return "Rs "+Math.round(n).toLocaleString("en-US"); }
function addLog(html){ S.log.unshift("<em>Day "+S.day+" · "+fmt(S.min)+"</em> "+html); S.log=S.log.slice(0,60); }
function need(who,k,d){ S.needs[who][k]=clamp(S.needs[who][k]+d); }
function bond(d){ S.bond=clamp(S.bond+d); }
function unlock(id){
  if(S.ach[id]) return; S.ach[id]=true; const a=ACH.find(x=>x.id===id);
  addLog("🏆 Achievement: <b>"+a.t+"</b>"); toast("🏆 "+a.t);
}
let toastT=null;
function toast(msg){ const t=$("toast"); t.innerHTML=msg; t.style.opacity=1; clearTimeout(toastT); toastT=setTimeout(()=>t.style.opacity=0,2600); }
// ===== SCENE RENDERER =====
const cv=$("scene"), cx=cv.getContext("2d"), W=1280, H=640;
const SKIN="#f4d9c4", HAIR="#151018";
const bubbles={}; // who -> {txt, until}
function say(who,txt,ms=3500){ bubbles[who]={txt,until:performance.now()+ms}; }
let hens=[]; function syncHens(){ while(hens.length<S.chickens.length) hens.push({x:rnd(500,1150),y:rnd(540,600),vx:rnd(-.6,.6),p:0,c:pickOne(["#fff6e8","#c96a2b","#e8b04a","#3a2a22"])}); hens.length=S.chickens.length; }
let flakes=[...Array(70)].map(()=>({x:rnd(0,W),y:rnd(0,H),v:rnd(.4,1.2)}));

function skyFor(m){
  const h=m/60;
  if(h<5||h>=20) return ["#0b1030","#1d1747"];
  if(h<7) return ["#3b3a78","#ff9a6b"];
  if(h<17) return ["#5aa9ff","#bfe3ff"];
  if(h<19) return ["#5b3f8f","#ff8a5c"];
  return ["#1a1650","#4b2b6b"];
}
function grad(y0,y1,c0,c1){ const g=cx.createLinearGradient(0,y0,0,y1); g.addColorStop(0,c0); g.addColorStop(1,c1); return g; }
function rr(x,y,w,h,r,fill){ cx.beginPath(); cx.roundRect(x,y,w,h,r); cx.fillStyle=fill; cx.fill(); }
function isNight(m){ const h=m/60; return h<6||h>=19; }
function sunMoon(m,x,y){ cx.fillStyle=isNight(m)?"#f2f0d8":"#ffd75e"; cx.beginPath(); cx.arc(x,y,isNight(m)?20:30,0,7); cx.fill(); }

function drawKarachi(m,t){
  const [a,b]=skyFor(m);
  cx.fillStyle="#3a2d55"; cx.fillRect(0,0,W,H); // wall
  // big window onto Clifton
  const wx=120,wy=60,ww=700,wh=330;
  cx.fillStyle=grad(wy,wy+wh,a,b); cx.fillRect(wx,wy,ww,wh);
  sunMoon(m,wx+560,wy+70);
  cx.fillStyle=isNight(m)?"#14324f":"#2f86b8"; cx.fillRect(wx,wy+250,ww,80); // Arabian Sea
  cx.strokeStyle="rgba(255,255,255,.35)"; cx.lineWidth=2;
  for(let i=0;i<6;i++){ cx.beginPath(); const yy=wy+262+i*11; for(let x=wx;x<wx+ww;x+=20){ cx.lineTo(x,yy+Math.sin(x/30+t/700+i)*3);} cx.stroke(); }
  const bl=[[0,120,60],[70,170,45],[125,90,70],[205,200,50],[265,140,80],[355,230,55],[420,110,70],[500,180,60],[570,150,90],[650,100,50]];
  bl.forEach(([x,h,w])=>{ cx.fillStyle=isNight(m)?"#1b1638":"#7c8db0"; cx.fillRect(wx+x,wy+250-h,w,h);
    if(isNight(m)){ cx.fillStyle="#ffd96a"; for(let yy=wy+260-h;yy<wy+240;yy+=18) for(let xx=wx+x+6;xx<wx+x+w-6;xx+=14) if((xx*yy)%7<4) cx.fillRect(xx,yy,6,8);} });
  cx.strokeStyle="#f6efe1"; cx.lineWidth=10; cx.strokeRect(wx,wy,ww,wh); cx.beginPath(); cx.moveTo(wx+ww/2,wy); cx.lineTo(wx+ww/2,wy+wh); cx.stroke();
  // TV
  rr(900,120,300,180,10,"#0d0a18"); rr(912,132,276,156,6, S.flags.loadshed?"#111":grad(132,288,"#2a1f6b","#e0405f"));
  cx.fillStyle="#f6efe1"; cx.font="700 18px Nunito"; cx.fillText(S.flags.loadshed?"Load-shedding... no power":"Movie night queue",930,220);
  cx.fillStyle="#5a4a80"; cx.fillRect(1030,300,40,40);
  // floor + rug + sofa
  cx.fillStyle="#6b4a3a"; cx.fillRect(0,470,W,170);
  rr(260,520,760,100,50,"#b8323f"); cx.strokeStyle="#ffb627"; cx.lineWidth=4; cx.beginPath(); cx.roundRect(280,532,720,76,40); cx.stroke();
  rr(860,380,380,110,22,"#19806f"); rr(880,350,340,60,18,"#22a08b");
}
function drawHaveli(m,t){
  const [a,b]=skyFor(m);
  cx.fillStyle=grad(0,380,a,b); cx.fillRect(0,0,W,380); sunMoon(m,1120,80);
  // fields
  cx.fillStyle="#c9a43a"; cx.fillRect(0,330,W,70);
  for(let x=0;x<W;x+=14){ cx.strokeStyle="#e8c45a"; cx.lineWidth=2; cx.beginPath(); cx.moveTo(x,400); cx.lineTo(x+Math.sin(t/500+x)*4,340+(S.crop>60?0:20)); cx.stroke(); }
  // haveli facade
  cx.fillStyle="#d9b98c"; cx.fillRect(140,110,760,320);
  cx.fillStyle="#b88c5a"; cx.fillRect(130,95,780,26); for(let x=140;x<900;x+=38){ cx.fillRect(x,78,22,20); }
  for(let i=0;i<5;i++){ const x=175+i*145; cx.fillStyle="#3b2a40"; cx.beginPath(); cx.moveTo(x,250); cx.lineTo(x,180); cx.quadraticCurveTo(x+45,120,x+90,180); cx.lineTo(x+90,250); cx.fill();
    cx.strokeStyle="#7a4b2a"; cx.lineWidth=5; cx.stroke(); if(isNight(m)){ cx.fillStyle="rgba(255,200,90,.7)"; cx.fillRect(x+10,195,70,50);} }
  rr(450,290,140,140,6,"#6b3d1f"); cx.strokeStyle="#ffb627"; cx.lineWidth=3; for(let i=0;i<4;i++) cx.strokeRect(460+i*8,300+i*8,120-i*16,130-i*16);
  cx.fillStyle="#3b2a40"; cx.font="800 20px 'Baloo 2'"; cx.fillText("SULTAN KOT",462,282);
  // neem tree
  cx.fillStyle="#5a3a22"; cx.fillRect(1010,200,28,240); cx.fillStyle="#2f7a3a"; [[1024,170,90],[970,220,60],[1080,220,60]].forEach(([x,y,r])=>{cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();});
  // courtyard
  cx.fillStyle="#b08a66"; cx.fillRect(0,430,W,210); cx.fillStyle="#a07a58"; for(let x=0;x<W;x+=80) for(let y=440;y<H;y+=40) cx.fillRect(x+((y/40)%2)*40,y,78,38);
  // charpai
  cx.fillStyle="#7a4b2a"; cx.fillRect(60,480,180,14); cx.fillRect(66,494,8,40); cx.fillRect(226,494,8,40);
  cx.strokeStyle="#e8d2a6"; cx.lineWidth=2; for(let x=66;x<236;x+=10){cx.beginPath();cx.moveTo(x,480);cx.lineTo(x+6,494);cx.stroke();}
  // tractor
  const tx=1120; rr(tx,440,120,50,8,"#c8302e"); rr(tx+60,400,50,45,6,"#c8302e"); cx.fillStyle="#9fd7ff"; cx.fillRect(tx+66,406,36,24);
  cx.fillStyle="#1a1a1a"; cx.beginPath(); cx.arc(tx+28,500,30,0,7); cx.fill(); cx.beginPath(); cx.arc(tx+100,505,20,0,7); cx.fill();
  // coop
  rr(560,470,0,0,0,"#000");

function advance(hours){
  const steps=Math.max(1,Math.round(hours*2));
  for(let i=0;i<steps;i++){
    S.min+=30;
    ORDER.forEach(k=>{
      const awake=isAwake(k);
      if(awake){ need(k,"energy",k==="noor"&&S.flags.noorUp?-2.5:-1.2); need(k,"hunger",-1.6); need(k,"fun",-.8); need(k,"social",-.5); }
      else { need(k,"energy",6); need(k,"hunger",-.4); }
    });
    const uh=Math.floor(usMin()/60); if(uh===7) S.flags.noorUp=false;
  }
  if(S.min>=23*60) endDay();

function labelOf(a){ return typeof a.l==="function"?a.l():a.l; }
function canDo(who,a){
  if(a.show && !a.show()) return "hide";
  if(!isAwake(who) && a.id!=="wake") return PEOPLE[who].name+" is asleep";
  if(a.id==="wake") return true;
  if(S.needs[who].energy<8 && a.h>=2) return "Too tired";
  if(a.when){ const r=a.when(); if(r!==true) return r; }
  return true;
}
function doAction(who,a){
  if(canDo(who,a)!==true) return;
  if(a.game){ playGame(a.game,sc=>{ a.reward(sc); advance(a.h); afterAct(); }); return; }
  a.run(); if(a.h) advance(a.h); afterAct();
}

let stopGame=null;
function playGame(key,done){
  const G=GAMES[key];
  showModal('<div class="mg"><h1>'+G.title+'</h1><p>'+G.how+'</p><div class="mghud"><span id="gL">Ready?</span><span id="gR"></span></div><canvas id="gc" width="800" height="600"></canvas><div class="row" id="gRow"><button class="btn" id="gStart">Start</button><button class="btn alt" id="gSkip">Skip the game</button></div></div>',()=>{
    const c=$("gc"), g=c.getContext("2d");
    const api={g,W:800,H:600,taps:[],keys:[],ptr:{x:400,y:300},over:false};
    api.hud=(l,r)=>{ $("gL").textContent=l; $("gR").textContent=r||""; };
    const pos=e=>{ const r=c.getBoundingClientRect(); return {x:(e.clientX-r.left)*800/r.width,y:(e.clientY-r.top)*600/r.height}; };
    c.onpointerdown=e=>{ e.preventDefault(); const p=pos(e); api.ptr=p; api.taps.push(p); };
    c.onpointermove=e=>{ api.ptr=pos(e); };
    const kd=e=>{ const m={ArrowLeft:"L",ArrowRight:"R",ArrowUp:"U",ArrowDown:"D"," ":"S",a:"L",d:"R"}[e.key]; if(m){ api.keys.push(m); e.preventDefault(); } };
    let raf=0,last=0;
    stopGame=()=>{ cancelAnimationFrame(raf); removeEventListener("keydown",kd); stopGame=null; };
    api.end=(score,msg)=>{ if(api.over) return; api.over=true; stopGame();
      $("gRow").innerHTML='<div style="flex:1"><b style="font-family:var(--display);font-size:22px">'+msg+'</b></div><button class="btn" id="gDone">Collect</button>';
      $("gDone").onclick=()=>{ hideModal(); done(score); }; };
    $("gSkip").onclick=()=>{ hideModal(); done(G.skip); };
    $("gStart").onclick=()=>{ $("gRow").innerHTML='<button class="btn alt" id="gQuit">Quit</button>'; $("gQuit").onclick=()=>{ hideModal(); done(G.skip); };
      addEventListener("keydown",kd); const frame=G.run(api); api.t=0;
      const loop=ts=>{ const dt=last?Math.min(.05,(ts-last)/1000):0; last=ts; api.t+=dt; frame(dt); api.taps.length=0; api.keys.length=0; if(!api.over) raf=requestAnimationFrame(loop); };
      raf=requestAnimationFrame(loop); };
    // preview frame
    g.fillStyle="#2a2148"; g.fillRect(0,0,800,600); g.fillStyle="#f6efe1"; g.font="800 40px 'Baloo 2'"; g.textAlign="center"; g.fillText(G.title,400,290); g.font="600 20px Nunito"; g.fillText("Tap Start",400,330); g.textAlign="left";
  });
}
function txt(g,s,x,y,size=24,col="#f6efe1",al="left"){ g.fillStyle=col; g.font="800 "+size+"px 'Baloo 2',sans-serif"; g.textAlign=al; g.fillText(s,x,y); g.textAlign="left"; }

       if(p>=1){ shot++; const inGoal=ball.tx>190&&ball.tx<610, saved=Math.abs(ball.tx-kx)<55; if(inGoal&&!saved){ goals++; res="GOOOAL!"; } else res=inGoal?"Saved!":"Wide!"; rt=1; ball=null; } }
     else { g.fillStyle="#fff"; g.beginPath(); g.arc(400,540,14,0,7); g.fill(); }
     if(rt>0){ rt-=dt; txt(g,res,400,300,64,res==="GOOOAL!"?"#ffb627":"#fff","center"); }
     api.hud("Goals: "+goals+"/"+shot,"Shot "+Math.min(shot+1,5)+" of 5");
     if(shot>=5&&rt<=0) api.end(goals,goals+"/5. "+(goals>=4?"Messi would be proud.":"Even Messi misses sometimes.")); };
 }},
 tooth:{title:"Tooth Doctor",how:"Cavities keep appearing on the practice jaw. Tap a tooth with a cavity to fill it. Future Dr. Umair at work.",skip:8,run(api){
   const g=api.g; let left=25,score=0; const teeth=[...Array(14)].map((_,i)=>({x:115+(i%7)*95,y:i<7?210:400,cav:0}));
   return dt=>{ left-=dt; if(Math.random()<dt*(1.4+(25-left)*.08)){ const free=teeth.filter(t=>!t.cav); if(free.length) pickOne(free).cav=.01; }
     g.fillStyle="#fde4e8"; g.fillRect(0,0,800,600); txt(g,"Dental practice lab",400,60,30,"#7a2040","center");
     g.fillStyle="#e2788f"; g.beginPath(); g.roundRect(60,130,680,170,60); g.fill(); g.beginPath(); g.roundRect(60,330,680,170,60); g.fill();
     teeth.forEach(t=>{ if(t.cav) t.cav+=dt; g.fillStyle="#fffdf4"; g.beginPath(); g.roundRect(t.x-38,t.y-55,76,110,22); g.fill(); g.strokeStyle="#e6dcc0"; g.lineWidth=3; g.stroke();
       if(t.cav){ const r=Math.min(26,8+t.cav*8); g.fillStyle=t.cav>3?"#3a2a1a":"#6b5030"; g.beginPath(); g.arc(t.x,t.y,r,0,7); g.fill(); } });
     api.taps.forEach(p=>teeth.forEach(t=>{ if(t.cav&&Math.abs(p.x-t.x)<42&&Math.abs(p.y-t.y)<60){ t.cav=0; score++; } }));
     const bad=teeth.filter(t=>t.cav>4).length;

 }},
 swim:{title:"Swimming Race",how:"Alternate left and right strokes (tap left side then right side, or ← →). Same side twice does nothing. Beat the other swimmer to the wall!",skip:0,run(api){
   const g=api.g; let me=0,rv=0,lastS="",go=-1.5,done=false; const rs=10.5-S.swim*.04;

     const strokes=api.taps.map(p=>p.x<400?"L":"R").concat(api.keys.filter(k=>k==="L"||k==="R"));
     if(go>0&&!done){ strokes.forEach(s=>{ if(s!==lastS){ me+=1.6+S.swim*.012; lastS=s; } }); rv+=dt*rs; }
     g.fillStyle="#1a7fb8"; g.fillRect(0,0,800,600); for(let i=0;i<6;i++){ g.fillStyle="rgba(255,255,255,.08)"; g.fillRect(0,i*100+Math.sin(api.t*2+i)*6,800,40); }
     g.fillStyle="#f6efe1"; for(let y=200;y<=400;y+=200) for(let x=0;x<800;x+=30) g.fillRect(x,y-3,18,6);
     g.fillStyle="#ffb627"; g.fillRect(740,100,16,400); txt(g,"WALL",748,90,20,"#fff","center");
     const px=60+Math.min(100,me)*6.8, rx=60+Math.min(100,rv)*6.8;
     [[px,300,"#7bd34a","Ariha"],[rx,480,"#ff4f7b","Rival"]].forEach(([x,y,c,n])=>{ g.fillStyle=c; g.beginPath(); g.ellipse(x,y,40,14,0,0,7); g.fill(); g.fillStyle=SKIN; g.beginPath(); g.arc(x+44,y-4,14,0,7); g.fill(); g.fillStyle=HAIR; g.beginPath(); g.arc(x+44,y-8,14,Math.PI,0); g.fill(); txt(g,n,x,y-28,20,"#fff","center"); });
     if(go<0) txt(g,"Ready... "+Math.ceil(-go),400,150,48,"#fff","center"); else if(go<.6) txt(g,"GO!",400,150,60,"#ffb627","center");
     api.hud("Ariha: "+Math.min(100,Math.round(me))+"m","Rival: "+Math.min(100,Math.round(rv))+"m");
     if(!done&&(me>=100||rv>=100)){ done=true; const win=me>=100&&me>=rv; api.end(win?1:0,win?"Ariha wins! Gold medal!":"So close. Next class, for sure."); } };
 }},
 vlog:{title:"Vlog Shoot",how:"Keep the subject inside your camera frame. Drag or move to follow it. The longer it stays in frame, the better the video.",skip:30,run(api){
   const g=api.g; let left=20,inT=0,tot=0; const s={x:400,y:300,vx:120,vy:80}; const subj=pickOne(["Des Moines pigeon","snowflake","street taco","squirrel"]); let fx=400,fy=300;
   return dt=>{ left-=dt; tot+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; if(s.x<60||s.x>740) s.vx*=-1; if(s.y<80||s.y>540) s.vy*=-1; if(Math.random()<.02){ s.vx=rnd(-260,260); s.vy=rnd(-200,200); }
     fx+=(api.ptr.x-fx)*Math.min(1,dt*10); fy+=(api.ptr.y-fy)*Math.min(1,dt*10);
     g.fillStyle="#9fb6d8"; g.fillRect(0,0,800,600); g.fillStyle="#eef3ff"; g.fillRect(0,470,800,130); for(let i=0;i<8;i++){ g.fillStyle="#5f7090"; g.fillRect(i*105,300-(i%3)*60,80,170+(i%3)*60); }
     g.fillStyle="#ffb627"; g.beginPath(); g.arc(s.x,s.y,24,0,7); g.fill(); txt(g,subj,s.x,s.y-34,18,"#140f24","center");
     const inside=Math.abs(s.x-fx)<110&&Math.abs(s.y-fy)<80; if(inside) inT+=dt;
     g.strokeStyle=inside?"#7bd34a":"#ff4f7b"; g.lineWidth=4; g.strokeRect(fx-110,fy-80,220,160); g.fillStyle="#ff3b3b"; g.beginPath(); g.arc(fx-90,fy-60,7,0,7); g.fill(); txt(g,"REC",fx-78,fy-53,16,"#ff3b3b");
     const pct=Math.round(inT/Math.max(tot,.01)*100); api.hud("In frame: "+pct+"%",Math.ceil(left)+"s");
     if(left<=0) api.end(pct,pct+"% in frame. "+(pct>70?"This one's going viral.":"Good enough for the edit.")); };
 }},
 dodson:{title:"Dodson Dodge",how:"Fight night with Umair! A glove flashes on one side. Dodge AWAY: tap the opposite side (or the opposite arrow). Three hits and it's over. Be The Magician.",skip:6,run(api){
   const g=api.g; let dodges=0,hits=0,side=0,wait=1,warn=0,lean=0,flash=0,res="";
   return dt=>{ flash=Math.max(0,flash-dt);
     if(!side){ wait-=dt; if(wait<=0){ side=Math.random()<.5?-1:1; warn=Math.max(.38,.9-dodges*.025); } }
     else { warn-=dt; const inp=api.taps.map(p=>p.x<400?-1:1).concat(api.keys.filter(k=>k==="L"||k==="R").map(k=>k==="L"?-1:1));
       if(inp.length){ lean=inp[0]; if(inp[0]===-side){ dodges++; res="Slipped it!"; } else { hits++; flash=.35; res="Ouch!"; } side=0; wait=rnd(.3,.9); }
       else if(warn<=0){ hits++; flash=.35; res="Too slow!"; side=0; wait=rnd(.4,.9); } }
     lean*=.9;
     g.fillStyle=flash?"#7a1020":"#151020"; g.fillRect(0,0,800,600); g.fillStyle="#2a2a3a"; g.beginPath(); g.moveTo(0,600); g.lineTo(120,380); g.lineTo(680,380); g.lineTo(800,600); g.fill();
     g.strokeStyle="#ff4f7b"; g.lineWidth=6; [380,330,280].forEach(y=>{ g.beginPath(); g.moveTo(80,y+60); g.lineTo(720,y+60); g.stroke(); });
     const fx=400+lean*90; g.fillStyle="#2b2b2b"; g.fillRect(fx-34,330,68,110); g.fillStyle=SKIN; g.beginPath(); g.arc(fx,300,32,0,7); g.fill(); g.fillStyle=HAIR; g.beginPath(); g.arc(fx,290,32,Math.PI,0); g.fill(); g.fillStyle="#ffb627"; g.fillRect(fx-36,420,72,26);
     txt(g,"Small but magic",fx,480,18,"#ffb627","center");
     if(side){ const gx=side<0?120:680; g.fillStyle="#c8102e"; g.beginPath(); g.arc(gx,300,60+Math.sin(api.t*40)*6,0,7); g.fill(); txt(g,"!",gx,322,64,"#fff","center"); }
     txt(g,"FIGHT NIGHT · watched from Karachi and Des Moines",400,60,22,"#f6efe1","center"); if(res) txt(g,res,400,170,40,res==="Slipped it!"?"#7bd34a":"#ff4f7b","center");
     api.hud("Dodges: "+dodges,"Hits: "+hits+"/3");
     if(hits>=3) api.end(dodges,dodges+" punches dodged. Umair: 'Dodson would never.'"); };
 }}
};
function rr2(g,x,y,w,h,r,c){ g.fillStyle=c; g.beginPath(); g.roundRect(x,y,w,h,r); g.fill(); }
function lane(api,o){
  const g=api.g; let left=o.secs,score=0,ln=1,px=400,items=[],spawn=0,flash=0,off=0; const LX=[220,400,580];
  return dt=>{ left-=dt; spawn-=dt; off=(off+dt*(300+(o.secs-left)*8))%80; flash=Math.max(0,flash-dt);
    api.taps.forEach(p=>{ ln=clamp(ln+(p.x<400?-1:1),0,2); }); api.keys.forEach(k=>{ if(k==="L") ln=Math.max(0,ln-1); if(k==="R") ln=Math.min(2,ln+1); });
    px+=(LX[ln]-px)*Math.min(1,dt*14);
    if(spawn<=0){ spawn=rnd(.35,.7); items.push({l:Math.floor(Math.random()*3),y:-40,good:Math.random()<.62}); }
    g.fillStyle=flash?"#7a2a2a":o.bg; g.fillRect(0,0,800,600); g.fillStyle="#2f7a3a"; g.fillRect(0,0,120,600); g.fillRect(680,0,120,600);
    g.fillStyle=o.stripe; for(let y=-80+off;y<600;y+=80){ g.fillRect(308,y,6,40); g.fillRect(488,y,6,40); }
    const sp=300+(o.secs-left)*8;
    items.forEach(it=>{ it.y+=sp*dt; const x=LX[it.l];
      if(it.good){ if(o.good==="wheat"){ g.fillStyle="#f2d16b"; for(let i=-2;i<=2;i++){ g.fillRect(x+i*7-2,it.y-30,4,50);} g.fillStyle="#a0702a"; g.fillRect(x-18,it.y,36,6); } else { g.fillStyle="#ffd84a"; g.beginPath(); for(let i=0;i<10;i++){ const a=i*Math.PI/5-Math.PI/2, r=i%2?12:28; g.lineTo(x+Math.cos(a)*r,it.y+Math.sin(a)*r); } g.fill(); } }
      else { if(o.bad==="buffalo"){ g.fillStyle="#2a2228"; g.beginPath(); g.ellipse(x,it.y,46,30,0,0,7); g.fill(); g.beginPath(); g.arc(x,it.y-34,18,0,7); g.fill(); g.strokeStyle="#ddd"; g.lineWidth=5; g.beginPath(); g.arc(x,it.y-40,24,Math.PI*1.1,Math.PI*1.9); g.stroke(); }
        else { g.fillStyle="#26232e"; g.beginPath(); g.ellipse(x,it.y,44,20,0,0,7); g.fill(); } }
      if(!it.hit && it.y>470&&it.y<540&&it.l===ln){ it.hit=1; if(it.good) score++; else { score=Math.max(0,score-2); flash=.3; } } });
    items=items.filter(it=>it.y<660&&!(it.hit&&it.good));
    if(o.player==="tractor"){ rr2(g,px-40,470,80,90,10,"#c8302e"); rr2(g,px-28,480,56,32,6,"#9fd7ff"); g.fillStyle="#111"; g.fillRect(px-54,520,16,44); g.fillRect(px+38,520,16,44); }
    else { g.strokeStyle="#7bd34a"; g.lineWidth=6; g.beginPath(); g.moveTo(px,470); g.lineTo(px,560); g.stroke(); g.fillStyle="#111"; g.fillRect(px-5,450,10,24); g.fillRect(px-5,550,10,24); g.fillStyle=SKIN; g.beginPath(); g.arc(px,505,14,0,7); g.fill(); g.fillStyle=HAIR; g.beginPath(); g.arc(px,500,14,Math.PI,0); g.fill(); }
    api.hud(o.label+": "+score,Math.ceil(left)+"s");
    if(left<=0) api.end(score,score+" "+o.label.toLowerCase()+" collected!"); };
}
